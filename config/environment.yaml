  - path: /home/augus/models/qwen36-35b-a3b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    size_gb: 21
    quant: Q4_K_M
  - path: /home/augus/models/qwen36-35b-a3b/Qwen3.6-35B-A3B-UD-Q5_K_M.gguf
    size_gb: 25
    quant: Q5_K_M
  - path: /home/augus/models/qwen36-35b-a3b/Qwen3.6-35B-A3B-UD-Q6_K.gguf
