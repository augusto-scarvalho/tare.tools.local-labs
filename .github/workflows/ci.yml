name: local-labs-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Compile Python sources
        run: python -m compileall -q src tools tests benchmark_harness_qa.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Qualify benchmark harness
        run: python tests/benchmark_harness/benchmark_harness_selftest.py
